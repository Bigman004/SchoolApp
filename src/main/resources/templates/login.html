		
<!DOCTYPE html>
<html lang="en" xmlns:th="http://thmyeleaf.org" xmlns="http://www.w3.org/1999/html">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <style>
      * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      }

      body {
      font-family: 'Segoe UI', sans-serif;
      background: #f0f2f5;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
      }

      .login-form {
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 2rem;
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      }

      .input {
      display: flex;
      align-items: center;
      gap: 10px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      padding: 0 12px;
      transition: border-color 0.2s, box-shadow 0.2s;
      }

      .input:focus-within {
      border-color: #4f46e5;
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.08);
      }

      .input img {
      width: 18px;
      height: 18px;
      opacity: 0.4;
      flex-shrink: 0;
      }

      .input input {
      flex: 1;
      border: none;
      outline: none;
      background: transparent;
      font-size: 14px;
      color: #111827;
      padding: 12px 0;
      }

      .input input::placeholder {
      color: #9ca3af;
      }

      #error p {
      font-size: 13px;
      color: #dc2626;
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 8px;
      padding: 8px 12px;
      }

      .action-section {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 0.25rem;
      }

      .action-section button {
      flex: 1;
      padding: 10px;
      background: #4f46e5;
      color: #ffffff;
      font-size: 14px;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      }

      .action-section button:hover { background: #4338ca; }
      .action-section button:active { transform: scale(0.98); }

      .action-section a {
      font-size: 13px;
      color: #4f46e5;
      cursor: pointer;
      text-decoration: none;
      }

      .action-section a:hover { text-decoration: underline; }
      </style>
	</head>
	<body>
		
		<form th:action ="@{/template/send_link/{linkToken}(linkToken = ${linkToken})}"
              method="post" class="login-form">
           <div class="email-input input">
             <img src="" alt="" />
             <input
               type="password"
               class="first password"
               id="password1"
               placeholder="Enter you password"
			   name="password1"
             />
           </div>
           <div class="password-input input">
             <img src=""/>
             <input
               type="password"
               name="password2"
               id="password2"
               placeholder="confirm you password"
             />
           </div>
            <div id ="error"></div>
           <div class="action-section">
             <button value="Log in" type="submit">change password</button>
           </div>
         </form>
		 
		</body>
    <script>
        var password1 = document.getElementById("password1");
        var password2 = document.getElementById("password2");
        var errorMessage = document.getElementById("error");
        document.getElementById("password2").addEventListener("input", ev => {
            if(password1.value !== password2.value) {
                errorMessage.innerHTML = "<p> password does not match</p>"
            }
            else{
                errorMessage.innerHTML = "";
            }
        })

    </script>
	</html>
