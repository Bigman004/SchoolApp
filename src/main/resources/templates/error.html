<!DOCTYPE html>
<html lang="en" xmlns:th="http://thmyeleaf.org">
  <head>
	  <title> error</title>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	  <style>
		  * {
			  box-sizing: border-box;
			  margin: 0;
			  padding: 0;
		  }

		  body {
			  font-family: sans-serif;
			  background-color: #f5f5f5;
			  min-height: 100vh;
			  display: flex;
			  align-items: center;
			  justify-content: center;
		  }

		  .error {
			  text-align: center;
			  max-width: 420px;
			  width: 100%;
			  padding: 2rem;
		  }

		  .skeleton {
			  width: 88px;
			  height: 88px;
			  border-radius: 50%;
			  background-color: #fdecea;
			  border: 1px solid #f5c6c6;
			  display: flex;
			  align-items: center;
			  justify-content: center;
			  margin: 0 auto 1.5rem;
		  }

		  .skeleton::after {
			  content: "✕";
			  font-size: 36px;
			  color: #c62828;
			  line-height: 1;
		  }

		  .error h2 {
			  font-size: 22px;
			  font-weight: 500;
			  color: #1a1a1a;
			  margin-bottom: 0.5rem;
		  }

		  .error p.subtitle {
			  font-size: 15px;
			  color: #6b6b6b;
			  line-height: 1.6;
			  margin-bottom: 2rem;
		  }

		  .error-card {
			  background-color: #fdecea;
			  border: 1px solid #f5c6c6;
			  border-radius: 12px;
			  padding: 1rem 1.25rem;
			  margin-bottom: 1.5rem;
			  display: flex;
			  align-items: flex-start;
			  gap: 12px;
			  text-align: left;
		  }

		  .error-card .error-label {
			  font-size: 13px;
			  font-weight: 500;
			  color: #b71c1c;
			  margin-bottom: 4px;
		  }

		  .error-card .error-message {
			  font-size: 14px;
			  color: #c62828;
			  line-height: 1.5;
		  }

		  .btn {
			  display: block;
			  width: 100%;
			  padding: 10px 0;
			  font-size: 14px;
			  font-weight: 500;
			  color: #1a1a1a;
			  background: transparent;
			  border: 1px solid #c0c0c0;
			  border-radius: 8px;
			  cursor: pointer;
			  transition: background 0.15s;
			  margin-bottom: 0.75rem;
		  }

		  .btn:hover {
			  background-color: #f0f0f0;
		  }

		  .back-link {
			  font-size: 13px;
			  color: #6b6b6b;
			  text-decoration: none;
		  }

		  .back-link:hover {
			  text-decoration: underline;
		  }
	  </style>
	</head>

	<body>
	<div class="error">
		<div class="skeleton"></div>
		<h2>Something went wrong</h2>
		<p class="subtitle">An unexpected error occurred. Please try again or contact support.</p>
		<div class="error-card">
			<div>
				<p class="error-label">Error details</p>
				<p class="error-message" th:text="${message}">Default error message.</p>
			</div>
		</div>
		<button class="btn" onclick="history.back()">Try again</button>
		<a href="/" class="back-link">← Go home</a>
	</div>

	</body>
	</html>
